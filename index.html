<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selfie de Natal 🎄</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;color:#fff;font-family:Montserrat,system-ui,sans-serif;background:linear-gradient(145deg,#7f1d1d,#b91c1c 45%,#14532d)}
.script{font-family:'Great Vibes',cursive}.glass{background:#ffffff1c;border:1px solid #ffffff33;backdrop-filter:blur(12px)}
.camera{position:relative;width:min(100%,430px);max-width:430px;aspect-ratio:9/16;margin:auto;overflow:hidden;border-radius:24px;background:#111;border:3px solid #facc15aa;box-shadow:0 20px 60px #0006}
video{width:100%;height:100%;object-fit:cover}.mirror{transform:scaleX(-1)}.overlay{position:absolute;inset:0;pointer-events:none}
.baker{position:absolute;right:2%;bottom:1%;width:50%;max-height:92%;object-fit:contain;filter:drop-shadow(0 10px 12px #0008)}
.top{display:none !important;position:absolute;top:5%;left:5%;right:5%;text-align:center;text-shadow:0 3px 8px #0009}.msg{font-size:clamp(18px,3.5vw,34px);font-weight:800}
.pill{display:inline-block;margin:6px 3px 0;padding:6px 12px;border-radius:999px;background:#0008;font-weight:700;font-size:clamp(12px,2vw,18px)}
.capture{width:78px;height:78px;border-radius:50%;background:#fff;border:7px solid #ffffff77;box-shadow:0 6px 25px #0006}
.btn{transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.modal{background:#000b;backdrop-filter:blur(5px)}
input,textarea{color:#111;width:100%;border-radius:12px;padding:11px 13px;border:1px solid #ddd;outline:0}.hidden{display:none!important}.baker.empty{display:none}
.snow{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.snow i{position:absolute;top:-20px;opacity:.8;animation:fall linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<main class="min-h-screen px-4 py-5">
<header class="max-w-5xl mx-auto flex justify-between items-center mb-5">
  <div>
    <h1 class="script text-5xl">Selfie de  🎄</h1>
  </div>
  <button id="configBtn" class="hidden glass rounded-full w-11 h-11">⚙️</button>
</header>
<section class="max-w-5xl mx-auto">
  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <div class="overlay">
      <div class="absolute top-3 left-1/2 -translate-x-1/2 z-10 px-3 py-1.5 rounded-full bg-black/35 text-white/90 text-[11px] font-semibold backdrop-blur-sm">📸</div>
      <div class="top">
        <div id="message" class="msg"></div>
        <span id="handle" class="pill"></span>
        <span id="hashtag" class="pill"></span>
      </div>
      <img id="baker" class="baker" alt="Boleira">
    </div>
    <div id="prompt" class="absolute inset-0 flex items-center justify-center bg-black/45 p-6 text-center">
      <div>
        <div class="text-5xl">📸</div>
        <h3 class="font-bold text-xl mt-2">Vamos tirar sua foto?</h3>
        <p class="text-sm opacity-90">Autorize a câmera frontal. A foto será vertical (9:16).</p>
        <button id="start" class="btn mt-5 px-6 py-3 rounded-full bg-white text-red-700 font-extrabold">Ativar câmera</button>
        <p id="camError" class="text-sm text-yellow-200 mt-3"></p>
      </div>
    </div>
  </div>
  <div class="flex justify-center items-center gap-5 mt-5">
    <button id="flip" class="btn glass rounded-full w-12 h-12 text-xl">↔️</button>
    <button id="capture" class="capture"></button>
  </div>
  <div class="max-w-2xl mx-auto mt-7 grid sm:grid-cols-3 gap-3">
    <div class="glass rounded-2xl p-4 text-center">🛍️<div class="font-bold">1. Compre</div><div class="text-xs opacity-80">Adquira o produto.</div></div>
    <div class="glass rounded-2xl p-4 text-center">📸<div class="font-bold">2. Tire a selfie</div><div class="text-xs opacity-80">Use a câmera.</div></div>
    <div class="glass rounded-2xl p-4 text-center">🎁<div class="font-bold">3. Compartilhe</div><div class="text-xs opacity-80">Publique no Instagram.</div></div>
  </div>
  <p id="status" class="text-center text-sm opacity-70 mt-5"></p>
</section>
</main>

<div id="result" class="modal hidden fixed inset-0 z-[100] p-4 overflow-auto">
  <div class="min-h-full flex items-center justify-center">
    <div class="bg-white text-gray-900 rounded-3xl max-w-md w-full p-5">
      <div class="flex justify-between"><h3 class="font-extrabold text-xl">Sua foto ficou pronta! 🎄</h3><button id="closeResult" class="text-2xl">×</button></div>
      <img id="resultImg" class="w-full rounded-2xl mt-3">
      <div class="grid grid-cols-2 gap-2 mt-4">
        <button id="download" class="rounded-xl bg-red-700 text-white font-bold py-3">⬇️ Baixar</button>
        <button id="share" class="rounded-xl bg-green-700 text-white font-bold py-3">📤 Compartilhar</button>
      </div>
      <button id="instagram" class="w-full mt-2 rounded-xl bg-pink-600 text-white font-bold py-3">📷 Abrir Instagram</button>
      <button id="copy" class="w-full mt-2 rounded-xl bg-gray-100 py-3 font-bold">📋 Copiar @ e hashtag</button>
      <button id="retake" class="w-full mt-3 text-gray-500 py-2">Tirar outra foto</button>
    </div>
  </div>
</div>

<div id="config" class="modal hidden fixed inset-0 z-[110] p-4 overflow-auto">
  <div class="min-h-full flex items-center justify-center">
    <div class="bg-white text-gray-900 rounded-3xl max-w-lg w-full p-6">
      <div class="flex justify-between">
        <div><h3 class="text-xl font-extrabold">Configurações</h3><p id="clientLabel" class="text-xs text-gray-500"></p></div>
        <button id="closeConfig" class="text-2xl">×</button>
      </div>
      <form id="form" class="space-y-4 mt-5">
        <label class="block text-sm font-bold">Instagram<input id="fHandle" maxlength="80"></label>
        <label class="block text-sm font-bold">Hashtag<input id="fHashtag" maxlength="80"></label>
        <label class="block text-sm font-bold">Título<input id="fTitle" maxlength="120"></label>
        <label class="block text-sm font-bold">Frase ina<textarea id="fMessage" rows="3" maxlength="180"></textarea></label>
        <label class="block text-sm font-bold">Foto/PNG da boleira<input id="fFile" type="file" accept="image/png,image/jpeg,image/webp"><small class="font-normal text-gray-500">Prefira PNG transparente para o efeito de máscara.</small></label>
        <label class="block text-sm font-bold">URL da foto<input id="fImage" placeholder="https://.../boleira.png"></label>
        <p id="saveStatus" class="text-sm"></p>
        <button class="w-full rounded-xl bg-red-700 text-white py-3 font-bold">Salvar configurações</button>
      </form>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
const p = new URLSearchParams(location.search);
const CLIENTE_ID = p.get('cliente') || '001';
const ADMIN = p.get('admin') === 'true';
const DEFAULTS = { handle: '@sua_confeitaria', hashtag: '#DaBoleira', title: 'Tire sua selfie de !', message: 'Que o seu  seja tão doce quanto um abraço! 🎄❤️', image: '' };
const $ = id => document.getElementById(id);
let sb = null, stream = null, facing = 'user', photo = '', file = null, settings = { ...DEFAULTS };

if (SUPABASE_URL && SUPABASE_ANON_KEY && typeof supabase !== 'undefined') {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

const handle = v => { v = (v || '').trim(); return v ? (v.startsWith('@') ? v : '@' + v) : '' };
const hashtag = v => { v = (v || '').trim(); return v ? (v.startsWith('#') ? v : '#' + v.replace(/^#+/, '')) : '' };

function apply(s) {
  settings = { handle: handle(s.handle || DEFAULTS.handle), hashtag: hashtag(s.hashtag || DEFAULTS.hashtag), title: s.title || DEFAULTS.title, message: s.message || DEFAULTS.message, image: s.image || DEFAULTS.image };
  $('title').textContent = settings.title;
  $('message').textContent = settings.message;
  $('handle').textContent = settings.handle;
  $('hashtag').textContent = settings.hashtag;
  const b = $('baker');
  b.classList.toggle('empty', !settings.image);
  if (settings.image) b.src = settings.image; else b.removeAttribute('src');
  $('clientLabel').textContent = 'Cliente: ' + CLIENTE_ID;
}

async function load() {
  if (sb) {
    try {
      let { data, error } = await sb.from('configuracoes').select('*').eq('cliente_id', CLIENTE_ID).maybeSingle();
      if (error) throw error;
      if (data) { apply(data); $('status').textContent = 'Configuração carregada do banco.'; return; }
    } catch (e) { console.warn(e); }
  }
  try { apply(JSON.parse(localStorage.getItem('_config_' + CLIENTE_ID) || 'null') || DEFAULTS); } catch { apply(DEFAULTS); }
}

async function save(s) {
  s.handle = handle(s.handle);
  s.hashtag = hashtag(s.hashtag);
  if (sb) {
    let { error } = await sb.from('configuracoes').upsert({ cliente_id: CLIENTE_ID, handle: s.handle, hashtag: s.hashtag, title: s.title, message: s.message, image: s.image, updated_at: new Date().toISOString() }, { onConflict: 'cliente_id' });
    if (error) throw error;
  } else {
    localStorage.setItem('_config_' + CLIENTE_ID, JSON.stringify(s));
  }
  apply(s);
}

async function camera() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    $('video').srcObject = stream;
    $('video').classList.toggle('mirror', facing === 'user');
    $('prompt').classList.add('hidden');$('camError').textContent = '';
  } catch (e) {
    $('camError').textContent = 'Não foi possível acessar a câmera. Verifique a permissão e se a página está rodando sob HTTPS.';
  }
}

// CORRIGIDO: Removido o duplo 'async'
async function capture() {
  const v = $('video');
  if (!v.videoWidth) return alert('Ative a câmera primeiro.');

  const W = 1080, H = 1920;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const letterH = 620;
  const photoY = letterH;
  const photoH = H - letterH;

  ctx.fillStyle = '#111';
  ctx.fillRect(0, photoY, W, photoH);

  drawVideoCover(ctx, v, 0, photoY, W, photoH);
  drawLetter(ctx, c, 0, 0, W, letterH);
  drawFinalBaker(ctx, c, photoY, photoH);

  photo = c.toDataURL('image/png');
  $('resultImg').src = photo;
  c.toBlob(b => file = new File([b], 'selfie-de-.png', { type: 'image/png' }), 'image/png');
  $('result').classList.remove('hidden');
}

function drawVideoCover(ctx, v, x, y, w, h) {
  const vw = v.videoWidth, vh = v.videoHeight;
  const target = w / h, source = vw / vh;
  let sx = 0, sy = 0, sw = vw, sh = vh;

  if (source > target) {
    sw = vh * target;
    sx = (vw - sw) / 2;
  } else {
    sh = vw / target;
    sy = (vh - sh) / 2;
  }

  ctx.save();
  if (facing === 'user') {
    ctx.translate(x + w, y);
    ctx.scale(-1, 1);
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, w, h);
  } else {
    ctx.drawImage(v, sx, sy, sw, sh, x, y, w, h);
  }
  ctx.restore();
}

function drawLetter(ctx, c, x, y, w, h) {
  ctx.save();
  ctx.fillStyle = '#fff9e9';
  ctx.fillRect(x, y, w, h);

  ctx.strokeStyle = '#8b1e1e';
  ctx.lineWidth = 18;
  ctx.strokeRect(9, 9, w - 18, h - 18);

  ctx.strokeStyle = '#d6a928';
  ctx.lineWidth = 5;
  ctx.strokeRect(29, 29, w - 58, h - 58);

  ctx.textAlign = 'center';
  ctx.font = '38px serif';
  ctx.fillStyle = '#8b1e1e';
  ctx.fillText('🎄   ✦   🎁', w / 2, 92);

  ctx.fillStyle = '#7b1f1f';
  ctx.font = "700 48px 'Great Vibes', cursive";
  ctx.fillText('Para Papai Noel', w / 2, 158);

  let msg = settings.message || '';
  const maxW = w - 130;
  let fs = 46;
  ctx.font = `800 ${fs}px Montserrat,Arial`;

  while (ctx.measureText(msg).width > maxW && fs > 25) {
    fs -= 2;
    ctx.font = `800 ${fs}px Montserrat,Arial`;
  }

  const words = msg.split(/\s+/);
  const lines = [];
  let line = '';

  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);

  ctx.fillStyle = '#29231d';
  const lh = fs * 1.18;
  const startY = 238;

  lines.slice(0, 4).forEach((t, i) => {
    ctx.fillText(t, w / 2, startY + i * lh);
  });

  ctx.font = '700 24px Montserrat,Arial';
  ctx.fillStyle = '#8b1e1e';
  const info = [settings.handle, settings.hashtag].filter(Boolean).join('   •   ');
  ctx.fillText(info, w / 2, h - 70);
  ctx.restore();
}

function drawFinalBaker(ctx, c, photoY, photoH) {
  const img = $('baker');
  if (!img || !img.complete || !img.naturalWidth || img.classList.contains('empty')) return;

  const W = c.width;
  const bw = W * .45;
  const bh = Math.min(photoH * .78, bw * img.naturalHeight / img.naturalWidth);
  const bx = W - bw - 22;
  const by = photoY + photoH - bh - 18;

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.45)';
  ctx.shadowBlur = 22;
  ctx.shadowOffsetY = 10;
  ctx.drawImage(img, bx, by, bw, bh);
  ctx.restore();
}

function download() {
  let a = document.createElement('a');
  a.href = photo;
  a.download = 'selfie-de-.png';
  a.click();
}

async function share() {
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ title: 'Minha selfie de  🎄', text: `${settings.handle} ${settings.hashtag}`, files: [file] });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  download();
  alert('A foto foi baixada. Publique-a no Instagram manualmente.');
}

async function copy() {
  let t = [settings.handle, settings.hashtag].filter(Boolean).join(' ');
  try {
    await navigator.clipboard.writeText(t);
    alert('Instagram e hashtag copiados!');
  } catch {
    alert(t);
  }
}

// BIND DOS EVENTOS
$('start').onclick = camera;
$('flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; if (stream) await camera(); };$('capture').onclick = capture;
$('download').onclick = download;
$('share').onclick = share;
$('instagram').onclick = () => window.open('https://www.instagram.com/', '_blank', 'noopener,noreferrer');$('copy').onclick = copy;
$('retake').onclick = () =>$('result').classList.add('hidden');
$('closeResult').onclick = () =>$('result').classList.add('hidden');

$('configBtn').onclick = () => {$('fHandle').value = settings.handle;
  $('fHashtag').value = settings.hashtag;
  $('fTitle').value = settings.title;
  $('fMessage').value = settings.message;
  $('fImage').value = settings.image.startsWith('data:') ? '' : settings.image;
  $('config').classList.remove('hidden');
};
$('closeConfig').onclick = () =>$('config').classList.add('hidden');

$('baker').onerror = () =>$('baker').classList.add('empty');
$('baker').onload = () =>$('baker').classList.remove('empty');

$('fFile').onchange = () => {
  let f = $('fFile').files[0];
  if (!f) return;
  let r = new FileReader();
  r.onload = () => { $('fImage').value = r.result; };
  r.readAsDataURL(f);
};

$('form').onsubmit = async e => {
  e.preventDefault();
  $('saveStatus').textContent = 'Salvando...';
  try {
    await save({ handle: $('fHandle').value, hashtag:$('fHashtag').value, title: $('fTitle').value.trim(), message:$('fMessage').value.trim(), image: $('fImage').value.trim() });$('saveStatus').textContent = sb ? 'Salvo no Supabase.' : 'Salvo apenas neste navegador.';
  } catch (err) {
    $('saveStatus').textContent = 'Erro: ' + err.message;
  }
};

if (ADMIN) $('configBtn').classList.remove('hidden');

// Flocos de neve
for (let i = 0; i < 25; i++) {
  let s = document.createElement('i');
  s.textContent = '❄';
  s.style.left = Math.random() * 100 + '%';
  s.style.fontSize = 8 + Math.random() * 14 + 'px';
  s.style.animationDuration = 5 + Math.random() * 8 + 's';
  s.style.animationDelay = -Math.random() * 10 + 's';
  $('snow').appendChild(s);
}

load();
</script>
</body>
</html>
